name: Release

# Build a signed release APK and publish a GitHub release for every commit
# pushed to master. Tag is unique per commit: r<run_number>-<short_sha>.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing config
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="r${{ github.run_number }}-$(git rev-parse --short HEAD)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "$TAG: $(git log -1 --pretty=%s)" \
            --notes "Automated build of commit $GITHUB_SHA" \
            app/build/outputs/apk/release/app-release.apk
